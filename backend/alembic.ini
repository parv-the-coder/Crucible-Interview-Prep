[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped, ordered filenames. The default (a bare hash) makes it
# impossible to see migration order from a directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC
# sqlalchemy.url is set in env.py from application settings -- one source of
# truth, and no credentials committed to the repo.

[post_write_hooks]
# ruff ships as a standalone binary, not a console_scripts entry point,
# so this is an exec hook rather than the type Alembic's docs show.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
